<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgImpact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C131E"/>
      <stop offset="50%" stop-color="#561D2C"/>
      <stop offset="100%" stop-color="#772E40"/>
    </linearGradient>
    <radialGradient id="lightGlow" cx="60%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#D9C9BD" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#772E40" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#302B2C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgImpact)"/>
  <rect width="1200" height="600" fill="url(#lightGlow)"/>

  <!-- Elegant fine lines representing nerve pathways and microvascular connections -->
  <g stroke="#D9C9BD" stroke-opacity="0.25" stroke-width="1" fill="none">
    <path d="M0 450 C300 480 500 200 800 240 C950 260 1100 150 1200 120"/>
    <path d="M0 380 C320 400 480 180 780 220 C920 240 1080 120 1200 90" stroke-dasharray="4 8"/>
    <path d="M150 600 C350 450 550 420 850 310 C1000 260 1120 300 1200 280"/>
    <circle cx="800" cy="240" r="4" fill="#D9C9BD" fill-opacity="0.7"/>
    <circle cx="780" cy="220" r="3" fill="#D9C9BD" fill-opacity="0.5"/>
    <circle cx="850" cy="310" r="3.5" fill="#D9C9BD" fill-opacity="0.6"/>
  </g>

  <!-- Expressive Line Drawing: Two Hands Connecting with Grace (Care & Motion) -->
  <g transform="translate(480, 100)" stroke="#F7F4EF" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Reaching Doctor Hand (Gentle, supportive, precise) -->
    <path d="M40 380 C70 320 120 280 180 250 C230 220 280 180 320 140 C335 125 350 135 340 150 C300 200 250 250 200 290 C150 330 110 390 90 440" opacity="0.85"/>
    <!-- Fingers outstretched in delicate proximity -->
    <path d="M260 190 C290 160 325 125 355 105 C368 95 380 105 370 120 C340 155 305 195 275 225" opacity="0.9"/>
    <path d="M280 220 C310 190 350 150 380 130 C392 122 402 132 392 144 C360 180 325 220 295 248" opacity="0.9"/>

    <!-- Subtle point of touch / focal pulse -->
    <circle cx="370" cy="112" r="5" fill="#D9C9BD" opacity="0.9"/>
    <circle cx="370" cy="112" r="16" stroke="#D9C9BD" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.6"/>
    <circle cx="370" cy="112" r="30" stroke="#D9C9BD" stroke-width="0.5" stroke-dasharray="3 6" opacity="0.3"/>
  </g>

  <!-- Editorial geometric framing -->
  <rect x="40" y="40" width="1120" height="520" fill="none" stroke="#D9C9BD" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="120" y1="40" x2="120" y2="560" stroke="#D9C9BD" stroke-opacity="0.08" stroke-width="1"/>
</svg>