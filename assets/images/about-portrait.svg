<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 920" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="60%" stop-color="#EFE9E0"/>
      <stop offset="100%" stop-color="#E2D6CB"/>
    </linearGradient>
    <linearGradient id="accentBordo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#772E40"/>
      <stop offset="100%" stop-color="#561D2C"/>
    </linearGradient>
    <filter id="aboutShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#302B2C" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="700" height="920" fill="url(#aboutGrad)"/>

  <!-- Subtle grid and background architectural linework -->
  <line x1="80" y1="0" x2="80" y2="920" stroke="#772E40" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="620" y1="0" x2="620" y2="920" stroke="#772E40" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="0" y1="140" x2="700" y2="140" stroke="#772E40" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="0" y1="780" x2="700" y2="780" stroke="#772E40" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Geometric aura -->
  <circle cx="350" cy="380" r="230" fill="#772E40" fill-opacity="0.04"/>

  <!-- Stethoscope / Medical Precision Linework -->
  <g transform="translate(140, 160)" filter="url(#aboutShadow)">
    <!-- Shoulders / Coat -->
    <path d="M40 760 C50 560 90 460 170 410 C195 395 245 395 270 410 C350 460 390 560 400 760 Z" fill="#FFFFFF"/>
    
    <!-- Coat lines and texture -->
    <path d="M190 410 L220 540 L150 580 L110 440 Z" fill="#FBF9F6" stroke="#E6DDD4" stroke-width="1.2"/>
    <path d="M250 410 L220 540 L290 580 L330 440 Z" fill="#FBF9F6" stroke="#E6DDD4" stroke-width="1.2"/>
    <line x1="220" y1="540" x2="220" y2="760" stroke="#E2D8CF" stroke-width="1.2"/>

    <!-- Head & Neck -->
    <path d="M195 370 C195 405 245 405 245 370 L245 310 L195 310 Z" fill="#EBDACF"/>
    <ellipse cx="220" cy="270" rx="60" ry="72" fill="#EFE0D5"/>
    
    <!-- Hair style -->
    <path d="M165 260 C155 190 185 140 220 140 C265 140 285 190 275 260 C270 300 260 340 260 360 C245 345 235 340 220 340 C195 340 175 330 165 260 Z" fill="#2E2829"/>

    <!-- Facial poise -->
    <path d="M210 270 L208 284 L213 284" stroke="#B49788" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M228 296 C224 301 216 301 212 296" stroke="#772E40" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <line x1="188" y1="250" x2="202" y2="248" stroke="#302B2C" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="236" y1="248" x2="250" y2="250" stroke="#302B2C" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Delicate Hands in Focus: Holding Anatomical Joint / Precision Touch -->
    <g transform="translate(130, 560)">
      <circle cx="90" cy="80" r="50" fill="#F7F4EF" stroke="#D9C9BD" stroke-width="1" stroke-dasharray="3 3"/>
      <!-- Precision Hand Vector Drawing -->
      <path d="M30 100 C45 80 65 75 80 82 C95 88 115 78 125 90 C132 98 128 115 118 120 C100 130 70 135 45 125 Z" fill="#EEDDCE" stroke="#772E40" stroke-width="1.5"/>
      <!-- Bone / tendon delicate line indicator -->
      <line x1="80" y1="82" x2="110" y2="60" stroke="#772E40" stroke-width="1.2" stroke-dasharray="2 4"/>
      <circle cx="110" cy="60" r="3" fill="#772E40"/>
    </g>
  </g>

  <!-- Fine art inscription label -->
  <g transform="translate(80, 810)">
    <rect width="250" height="56" fill="#FFFFFF" fill-opacity="0.9" rx="2" stroke="#E2D8CF" stroke-width="1"/>
    <text x="24" y="26" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-style="italic" fill="#772E40">Cirurgia da Mão e Microcirurgia</text>
    <text x="24" y="44" font-family="'Manrope', sans-serif" font-size="10" letter-spacing="2" fill="#5F5855">MANAUS — AMAZONAS</text>
  </g>

  <!-- Framing edge lines -->
  <rect x="20" y="20" width="660" height="880" fill="none" stroke="#772E40" stroke-opacity="0.1" stroke-width="1"/>
</svg>